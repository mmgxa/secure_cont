apiVersion: v1
kind: Pod
metadata:
  name: kata-fc-test
spec:
  runtimeClassName: kata-fc
  tolerations:
    - key: kata-runtime
      value: "true"
      effect: NoSchedule
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "echo 'Runtime: Firecracker' && uname -r && sleep 120"]
      securityContext:
        privileged: true
  restartPolicy: Never
